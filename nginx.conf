server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La página y los tracks se piden siempre frescos: así nadie ve una versión vieja.
    location ~* \.(html|gpx)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
